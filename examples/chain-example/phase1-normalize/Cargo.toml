[package]
name = "chain-stage-normalize"
version = "0.1.0"
edition = "2021"
default-run = "chain-stage-normalize"

[[bin]]
name = "chain-stage-normalize"
path = "src/main.rs"

[[bin]]
name = "gen_input"
path = "bin/gen_input.rs"
required-features = ["gen-input"]

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]
gen-input = []

[dependencies]
raster = { path = "../../../crates/raster", default-features = false }
serde.workspace = true
