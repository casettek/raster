[package]
name = "raster-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types and schemas for the Raster toolchain"

[features]
default = ["std"]
std = ["serde/std", "serde_json", "bincode"]
alloc = []
# Test instrumentation: count leaf hashes per thread (`tree::leaf_hash_count`).
hash-count = ["std"]

[dependencies]
serde.workspace = true
# postcard is no_std compatible for tile ABI serialization
postcard.workspace = true
# Host SHA-256 (see `src/hash.rs`; in the zkVM, RISC Zero's accelerated
# implementation is used instead). `default-features = false` keeps
# `sha2`/`digest` from pulling in `std`: a std-enabled `digest` in the
# generated tile guest collides with risc0-zkvm's no_std guest panic handler
# (duplicate `panic_impl`). `sha2::Digest` is still the shared trait there.
sha2 = { workspace = true, default-features = false }

# Optional std-only dependencies
serde_json = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }

# Accelerated SHA-256 for `src/hash.rs`, only when building a guest. Guests
# already depend on `risc0-zkvm` (default features), so features unify.
[target.'cfg(target_os = "zkvm")'.dependencies]
risc0-zkvm = { version = "3.0", default-features = false }
