[package]
name = "raster-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[build-dependencies]
# Builds the protocol guests (build.rs), path-independently.
raster-guest-build.workspace = true
toml = "0.8"

[dependencies]
raster-core = { workspace = true, features = ["std"] }
raster-compiler = { workspace = true }
raster-backend = { workspace = true }

bincode.workspace = true
bridgetree.workspace = true
hex.workspace = true
incrementalmerkletree.workspace = true
itertools.workspace = true
rand.workspace = true
sha2.workspace = true
serde.workspace = true
postcard.workspace = true

risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "std"] }

[package.metadata.risc0]
methods = ["guests/transition", "guests/authorization", "guests/chain_fraud", "guests/defence"]


