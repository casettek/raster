[package]
name = "raster-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[build-dependencies]
risc0-build = "3.0"

[dependencies]
raster-core = { workspace = true, features = ["std"] }
raster-compiler = { workspace = true }
raster-backend = { workspace = true }

bincode.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
libc = "0.2"
bumpalo = "3"
bridgetree.workspace = true
hex.workspace = true
incrementalmerkletree.workspace = true
itertools.workspace = true
rand.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }

risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "std"] }

[package.metadata.risc0]
methods = ["guests/transition", "guests/authorization", "guests/chain_fraud"]


