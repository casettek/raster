[package]
name = "control-flow-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
raster-core = { path = "../../../raster-core", features = ["std"] }
guest-common = { path = "../guest_common" }

risc0-zkvm = "3.0"

serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }

[dev-dependencies]
bridgetree = "0.7"

[profile.release]
opt-level = 3
lto = true
