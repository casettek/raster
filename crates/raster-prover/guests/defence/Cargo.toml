[package]
name = "defence-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
raster-core = { path = "../../../raster-core", features = ["std"] }

risc0-zkvm = "3.0"

serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
