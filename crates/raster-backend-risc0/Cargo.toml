[package]
name = "raster-backend-risc0"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RISC0 zkVM backend for the Raster toolchain"

[features]
default = []
# Enable Metal GPU acceleration for proving (macOS Apple Silicon)
metal = ["risc0-zkvm/metal"]
# Enable CUDA GPU acceleration for proving (NVIDIA GPUs): the STARK provers and
# recursion. The final Groth16 wrap stays on RISC Zero's Docker prover.
#
# risc0-zkvm's own `cuda` is only a list of its provers' `cuda` features, and it
# includes `risc0-groth16/cuda`, which replaces the Docker wrapper with a native
# CUDA one. On an RTX 5080 that wrapper returned a receipt that fails
# verification. So the provers are named here one by one, without the wrapper.
cuda = [
    "risc0-circuit-keccak/cuda",
    "risc0-circuit-recursion/cuda",
    "risc0-circuit-rv32im/cuda",
    "risc0-zkp/cuda",
]
# `cuda`, with the Groth16 wrap on the GPU as well: all of risc0-zkvm's `cuda`.
cuda-groth16 = ["cuda", "risc0-zkvm/cuda"]

[dependencies]
# This crate uses std-gated raster-core APIs (e.g. `Error::Io`), so it must
# enable the `std` feature rather than relying on a downstream crate to.
raster-core = { workspace = true, features = ["std"] }
raster-backend.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
rayon.workspace = true

# RISC0 zkVM dependencies
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "std"] }
risc0-build = "3.0"
# risc0-zkvm's provers, named only so `cuda` can turn on their GPU code without
# risc0-zkvm's own `cuda` (see [features]). Declared as risc0-zkvm declares
# them; without `cuda` they are not dependencies of this crate at all.
risc0-circuit-keccak = { version = "4.0", default-features = false, optional = true }
risc0-circuit-recursion = { version = "4.0", default-features = false, optional = true }
risc0-circuit-rv32im = { version = "4.0", default-features = false, optional = true }
risc0-zkp = { version = "3.0", default-features = false, optional = true }

# Tile guests: staged, path-independent builds
raster-guest-build.workspace = true
cargo_metadata = "0.19"
hex = "0.4"

[dev-dependencies]
tempfile = "3.14"
